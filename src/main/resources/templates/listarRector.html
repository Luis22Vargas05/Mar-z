<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es-es">
<head th:replace="Layout/layout ::head">
    <meta charset="UTF-8">
</head>

<body>
<nav th:replace="Layout/layout :: navbar"></nav>
<div class ="container" style="margin-top: 10px; padding: 5px; width: 80%">
    <table id="tablex" class="table table-striped table-bordered">
        <thead class="table-dark">
        <tr>
            <th>ID</th>
            <th>Primer Apellido</th>
            <th>Segundo Apellido</th>
            <th>Nombre</th>
            <th>NumDocumento</th>
            <th>Tipo</th>
            <th>Fecha Nacimiento</th>
            <th>Universidad</th>
            <th></th>
            <th></th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="rector: ${rectores}">

            <td th:text="${rector.idrector}"></td>
            <td th:text="${rector.primerapellido}"></td>
            <td th:text="${rector.segundoapellido}"></td>
            <td th:text="${rector.nombre}"></td>
            <td th:text="${rector.numdocumento}"></td>
            <td th:text="${rector.tipo}"></td>
            <td th:text="${rector.fechadenacimiento}"></td>
            <td th:text="${rector.universidad.nombre}"></td>
            <td class="text-center"><a class="btn btn-danger btn-xs" th:href="@{/eliminarRectorBy/} + ${rector.idrector}" onclick="return confirm('¿Esta seguro de eliminar el regidtro?')" th:text="'Eliminar'"></a></td>
            <td class="text-center">
                <a class="btn btn-info btn-xs"
                   th:href="@{/editarRectorBy/{id}(id=${rector.idrector})}"
                   th:text="'Editar'">
                </a>
            </td>
        </tr>
        </tbody>
    </table>
    <a th:href="@{/crearRectores}" class="btn btn-primary">Registrar Rector</a>
</div>
<footer th:replace="Layout/layout :: footer"></footer>
</body>
</html>
