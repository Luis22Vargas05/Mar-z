<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es-es">

<head th:replace="Layout/layout ::head">
    <meta charset="UTF-8">
    <title>Consulta 2</title>
</head>

<body>

<nav th:replace="Layout/layout :: navbar"></nav>

<div class="container" style="margin-top: 10px; padding: 5px; width: 80%">

    <h1>Seccionales cuya PK es igual o menor</h1>

    <table id="tablex" class="table table-striped table-bordered">

        <thead class="table-dark">
        <tr>
            <th>ID Seccional</th>
            <th>Dirección</th>
            <th>Nombre</th>
            <th>ID Universidad</th>
        </tr>
        </thead>

        <tbody>

        <tr th:each="seccional : ${seccionales}">

            <td th:text="${seccional.idseccional}"></td>

            <td th:text="${seccional.direccion}"></td>

            <td th:text="${seccional.nombre}"></td>

            <td th:text="${seccional.universidad.iduniversidad}"></td>

        </tr>

        </tbody>

    </table>

</div>

<footer th:replace="Layout/layout :: footer"></footer>

</body>
</html>
