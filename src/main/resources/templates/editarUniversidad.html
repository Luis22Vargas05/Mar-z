<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es-es">
<head th:replace="Layout/layout ::head">

</head>
<body>
<nav th:replace="Layout/layout :: navbar"></nav>
<h1 class="page-content" th:text="${titulo}"></h1>
<div class = "container" style="margin-top: 10px; padding: 5px; width: 80%">
    <form th:object="${universidadActualizar}" th:action="@{/editarUniversidadBy/{id}(id = ${universidadActualizar.iduniversidad})}" method="post">
        <div class="mb-3">
            <label for="nombreform" class="form-label">Nombre</label>
            <input type="text" class="form-control" id="nombreform" th:field="*{nombre}" aria-describedby="nombreHelp" required>
            <div id="nombreHelp" class="form-text">Ej: Juan de Castellanos</div>
        </div>
        <div class="mb-3">
            <label for="nitform" class="form-label">Nit</label>
            <input type="text" class="form-control" id="nitform" th:field="*{nit}" aria-describedby="nitHelp" required>
            <div id="nitHelp" class="form-text">Ej: 1234567-1</div>
        </div>
        <div class="mb-3">
            <label for="descripcionform" class="form-label">Descripcion</label>
            <input type="text" class="form-control" id="descripcionform" th:field= "*{descripcion}" aria-describedby="descripcionHelp" required>
            <div id="descripcionHelp" class="form-text">Ej: universidad privada</div>
        </div>
        <button type="submit" class="btn btn-primary">Crear Universidad</button>
    </form>
</div>
<footer th:replace="layout/layout :: footer"></footer>
</body>
</html>
