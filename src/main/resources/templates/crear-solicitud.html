<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>MAR-Z | Nueva solicitud</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">
</head>

<body class="bg-light">

<div class="container py-5">

  <div class="row justify-content-center">

    <div class="col-md-8">

      <div class="card shadow">

        <div class="card-body p-4">

          <h2 class="mb-2">
            Nueva solicitud
          </h2>

          <p class="text-muted">
            Registre una nueva solicitud de soporte.
          </p>

          <hr>

          <form th:action="@{/solicitudes/guardar}"
                th:object="${solicitud}"
                method="post">

            <!-- Título -->
            <div class="mb-3">

              <label for="titulo" class="form-label">
                Título
              </label>

              <input type="text"
                     id="titulo"
                     th:field="*{titulo}"
                     class="form-control"
                     placeholder="Ingrese el título de la solicitud"
                     maxlength="150"
                     required>

            </div>

            <!-- Descripción -->
            <div class="mb-3">

              <label for="descripcion" class="form-label">
                Descripción
              </label>

              <textarea id="descripcion"
                        th:field="*{descripcion}"
                        class="form-control"
                        rows="5"
                        placeholder="Describa detalladamente el problema o solicitud"
                        required></textarea>

            </div>

            <!-- Categoría -->
            <div class="mb-3">

              <label for="categoria" class="form-label">
                Categoría
              </label>

              <select id="categoria"
                      th:field="*{categoria}"
                      class="form-select"
                      required>

                <option value="">
                  Seleccione una categoría
                </option>

                <option value="HARDWARE">
                  Hardware
                </option>

                <option value="SOFTWARE">
                  Software
                </option>

                <option value="RED">
                  Red
                </option>

                <option value="ACCESO">
                  Acceso
                </option>

                <option value="OTRO">
                  Otro
                </option>

              </select>

            </div>

            <!-- Información automática -->
            <div class="alert alert-info">

              <strong>Información de la solicitud</strong>

              <br>

              La prioridad inicial será:
              <strong>MEDIA</strong>

              <br>

              El estado inicial será:
              <strong>ABIERTA</strong>

            </div>

            <!-- Botones -->
            <div class="d-flex gap-2">

              <button type="submit"
                      class="btn btn-primary">
                Crear solicitud
              </button>

              <a th:href="@{/login}"
                 class="btn btn-secondary">
                Cancelar
              </a>

            </div>

          </form>

        </div>

      </div>

    </div>

  </div>

</div>

</body>
</html>
