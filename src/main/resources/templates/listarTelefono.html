<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es-es">
<head th:replace="Layout/layout :: head">
</head>
<body>
<nav th:replace="Layout/layout :: navbar"></nav>
<div class="container"
     style="margin-top: 10px; padding: 5px; width: 80%">
    <table id="tablex" class="table table-striped table-bordered">
        <thead class="table-dark">
        <tr>
            <th>ID</th>
            <th>Tipo</th>
            <th>Número</th>
            <th>Seccional</th>
            <th></th>
            <th></th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="telefono : ${telefonos}">

            <td th:text="${telefono.idtelefono}"></td>
            <td th:text="${telefono.tipo}"></td>
            <td th:text="${telefono.numero}"></td>
            <td th:text="${telefono.seccional.nombre}"></td>
            <td class="text-center">
                <a class="btn btn-danger btn-xs"
                   th:href="@{/eliminarTelefonoBy/{id}(id=${telefono.idtelefono})}"
                   onclick="return confirm('¿Esta seguro de eliminar el registro?')"
                   th:text="'Eliminar'"></a></td>
            <td class="text-center">
                <a class="btn btn-info btn-xs"
                   th:href="@{/editarTelefonoBy/{id}(id=${telefono.idtelefono})}"
                   th:text="'Editar'">
                </a>
            </td>
        </tr>
        </tbody>
    </table>
    <a th:href="@{/crearTelefonos}"
       class="btn btn-primary">
        Registrar Teléfono
    </a>
</div>
<footer th:replace="Layout/layout :: footer"></footer>
</body>
</html>
