<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es-es">

<head th:replace="Layout/layout ::head">
    <meta charset="UTF-8">
    <title>Consulta 1</title>
</head>

<body>

<nav th:replace="Layout/layout :: navbar"></nav>

<div class="container" style="margin-top: 10px; padding: 5px; width: 80%">

    <h1>Rectores cuyo tipo de documento es 1</h1>

    <table id="tablex" class="table table-striped table-bordered">

        <thead class="table-dark">
        <tr>
            <th>ID</th>
            <th>Primer Apellido</th>
            <th>Segundo Apellido</th>
            <th>Nombre</th>
            <th>Número Documento</th>
            <th>Tipo</th>
            <th>Fecha Nacimiento</th>
            <th>ID Universidad</th>
        </tr>
        </thead>

        <tbody>

        <tr th:each="rector : ${rectores}">

            <td th:text="${rector.idrector}"></td>
            <td th:text="${rector.primerapellido}"></td>
            <td th:text="${rector.segundoapellido}"></td>
            <td th:text="${rector.nombre}"></td>
            <td th:text="${rector.numdocumento}"></td>

            <td>
                <span th:if="${rector.tipo == 1}">CC</span>
                <span th:if="${rector.tipo == 2}">TI</span>
                <span th:if="${rector.tipo == 3}">CE</span>
            </td>

            <td th:text="${rector.fechadenacimiento}"></td>
            <td th:text="${rector.universidad.iduniversidad}"></td>

        </tr>

        </tbody>

    </table>

</div>

<footer th:replace="Layout/layout :: footer"></footer>

</body>
</html>
