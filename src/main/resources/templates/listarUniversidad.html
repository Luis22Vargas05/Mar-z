<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es-es">
<head th:replace="Layout/layout :: head">
</head>
<body>
<nav th:replace="Layout/layout :: navbar"></nav>
<div class ="container" style="margin-top: 10px; padding: 5px; width: 80%">
    <table id = "tablex" class = "table table-striped table-bordered">
        <thead class ="table-dark">
        <tr>
            <th>ID</th>
            <th>Nombre</th>
            <th>Nit</th>
            <th>Estado</th>
            <th>Descripción</th>
            <th></th>
            <th></th>
            <th></th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="universidad: ${universidades}">
            <td th:text="${universidad.iduniversidad}"></td>
            <td th:text="${universidad.nombre}"></td>
            <td th:text="${universidad.nit}"></td>
            <td th:text="${universidad.estado}"></td>
            <td th:text="${universidad.descripcion}"></td>
            <td class="text-center"><a class="btn btn-danger btn-xs" th:href="@{/eliminarUniversidadBy/} + ${universidad.iduniversidad}" onclick="return confirm('¿Esta seguro de eliminar el registro?')" th:text="'Eliminar'"></a></td>
            <td class="text-center"><a class="btn btn-info btn-xs" th:href="@{/editarUniversidadBy/{id}(id=${universidad.iduniversidad})}" th:text ="Editar"></a></td>
            <td class="text-center"><a class="btn btn-danger btn-xs" th:href="@{/cambiarEstado/} + ${universidad.iduniversidad}" onclick="return confirm('¿Esta seguro de cambiar el Estado?')" th:text="'Cambiar estado'"></a></td>
        </tr>
        </tbody>
    </table>
    <a th:href="@{/crearUniversidades}" class="btn btn-primary">Registrar Universidad</a>

</div>

<footer th:replace="Layout/layout :: footer"></footer>
</body>
</html>
