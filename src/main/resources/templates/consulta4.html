<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es-es">

<head th:replace="Layout/layout ::head">
    <meta charset="UTF-8">
    <title>Consulta 4</title>
</head>

<body>

<nav th:replace="Layout/layout :: navbar"></nav>

<div class="container" style="margin-top: 10px; padding: 5px; width: 80%">

    <h1>Primeros 8 registros de Teléfonos</h1>

    <table id="tablex" class="table table-striped table-bordered">

        <thead class="table-dark">
        <tr>
            <th>ID</th>
            <th>Tipo</th>
            <th>Número</th>
            <th>ID Seccional</th>
        </tr>
        </thead>

        <tbody>

        <tr th:each="telefono : ${telefonos}">

            <td th:text="${telefono.idtelefono}"></td>
            <td th:text="${telefono.tipo}"></td>
            <td th:text="${telefono.numero}"></td>
            <td th:text="${telefono.seccional.idseccional}"></td>

        </tr>

        </tbody>

    </table>

</div>

<footer th:replace="Layout/layout :: footer"></footer>

</body>

</html>
