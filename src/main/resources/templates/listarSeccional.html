<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es-es">

<head th:replace="Layout/layout :: head">
</head>

<body>

<nav th:replace="Layout/layout :: navbar"></nav>

<div class="container"
     style="margin-top: 10px; padding: 5px; width: 80%">

    <table id="tablex"
           class="table table-striped table-bordered">

        <thead class="table-dark">

        <tr>
            <th>ID</th>
            <th>Nombre</th>
            <th>Dirección</th>
            <th>Universidad</th>
            <th></th>
            <th></th>
        </tr>

        </thead>

        <tbody>

        <tr th:each="seccional : ${seccionales}">
            <td th:text="${seccional.idseccional}"></td>
            <td th:text="${seccional.nombre}"></td>
            <td th:text="${seccional.direccion}"></td>
            <td th:text="${seccional.universidad.nombre}"></td>
            <td class="text-center">
                <a class="btn btn-danger btn-xs"
                   th:href="@{/eliminarSeccionalBy/{id}(id=${seccional.idseccional})}"
                   onclick="return confirm('¿Esta seguro de eliminar el registro?')"
                   th:text="'Eliminar'">
                </a>

            </td>
            <td class="text-center">
                <a class="btn btn-info btn-xs"
                   th:href="@{/editarSeccionalBy/{id}(id=${seccional.idseccional})}"
                   th:text="'Editar'">
                </a>
            </td>

        </tr>

        </tbody>

    </table>


    <a th:href="@{/crearSeccionales}"
       class="btn btn-primary">

        Registrar Seccional

    </a>

</div>

<footer th:replace="Layout/layout :: footer"></footer>

</body>
</html>
