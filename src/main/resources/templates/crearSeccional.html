
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es-es">

<head th:replace="Layout/layout ::head">
</head>

<body>

<nav th:replace="Layout/layout :: navbar"></nav>

<div class="container" style="margin-top: 10px; padding: 5px; width: 80%">

  <form th:object="${objseccional}"
        th:action="@{/crearSeccional}"
        method="post">

    <div class="mb-3">
      <label for="nombreform" class="form-label">
        Nombre
      </label>

      <input type="text"
             class="form-control"
             id="nombreform"
             th:field="*{nombre}"
             aria-describedby="nombreHelp"
             required
             oninvalid="this.setCustomValidity('Este campo no puede estar vacío por favor digite el nombre')"
             oninput="this.setCustomValidity('')">

      <div id="nombreHelp" class="form-text">
        Ej: Seccional Tunja
      </div>
    </div>

    <div class="mb-3">
      <label for="direccionform" class="form-label">
        Dirección
      </label>

      <input type="text"
             class="form-control"
             id="direccionform"
             th:field="*{direccion}"
             aria-describedby="direccionHelp"
             required>

      <div id="direccionHelp" class="form-text">
        Ej: Calle 20 # 10-25
      </div>
    </div>


    <div class="mb-3">
      <label for="universidadform" class="form-label">
        Universidad
      </label>

      <select class="form-select" id="universidadform" th:field="*{universidad}" required>
        <option value="">
          Seleccione una universidad
        </option>
        <option th:each="universidad : ${universidades}" th:value="${universidad.iduniversidad}" th:text="${universidad.nombre}">
        </option>
      </select>
    </div>

    <button type="submit" class="btn btn-primary">
      Crear Seccional
    </button>

    <a th:href="@{/listarSeccionales}"
       class="btn btn-danger">
      Cancelar
    </a>

  </form>

</div>

<footer th:replace="layout/layout :: footer"></footer>

</body>
</html>
