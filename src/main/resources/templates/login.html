<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>MAR-Z | Iniciar sesión</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>

<body class="bg-light">

<div class="container">
    <div class="row justify-content-center align-items-center"
         style="min-height: 100vh;">

        <div class="col-md-5">

            <div class="card shadow">

                <div class="card-body p-4">

                    <h2 class="text-center mb-4">
                        MAR-Z
                    </h2>

                    <p class="text-center text-muted">
                        Plataforma de gestión de solicitudes
                    </p>

                    <!-- Mensaje de error -->
                    <div th:if="${error}"
                         class="alert alert-danger"
                         th:text="${error}">
                    </div>

                    <!-- Formulario de inicio de sesión -->
                    <form th:action="@{/login}" method="post">

                        <div class="mb-3">
                            <label for="correo" class="form-label">
                                Correo electrónico
                            </label>

                            <input type="email"
                                   class="form-control"
                                   id="correo"
                                   name="correo"
                                   placeholder="Ingrese su correo"
                                   required>
                        </div>

                        <div class="mb-3">
                            <label for="contrasena" class="form-label">
                                Contraseña
                            </label>

                            <input type="password"
                                   class="form-control"
                                   id="contrasena"
                                   name="contrasena"
                                   placeholder="Ingrese su contraseña"
                                   required>
                        </div>

                        <button type="submit"
                                class="btn btn-primary w-100">
                            Iniciar sesión
                        </button>

                    </form>

                    <!-- Mensaje cuando el login es correcto -->
                    <div th:if="${usuario}"
                         class="alert alert-success mt-3">

                        <strong>Inicio de sesión correcto.</strong>

                        <hr>

                        <p class="mb-1">
                            Usuario:
                            <strong th:text="${usuario.nombre}"></strong>
                        </p>

                        <p class="mb-0">
                            Rol:
                            <strong th:text="${usuario.rol}"></strong>
                        </p>

                    </div>

                </div>

            </div>

        </div>

    </div>
</div>

</body>
</html>
